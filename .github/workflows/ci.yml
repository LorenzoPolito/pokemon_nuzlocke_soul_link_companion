name: hosted-verification

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]

# The workflow only reads the checkout and reports its status to the PR.
permissions: {}

concurrency:
  group: hosted-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # package.json declares >=22.18; setup-node resolves the engine range
      # directly so this cannot silently drift from the repository contract.
      - name: Set up Node.js from package.json engines
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:system:install

      - name: Run required verification
        id: verify
        run: npm run verify

      - name: Publish verification evidence
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## Hosted verification'
            echo
            echo '- Trigger: pull request targeting `develop` or `main`'
            echo '- Install: `npm ci` (lockfile-enforced)'
            echo '- Browser prerequisite: `npm run test:system:install`'
            echo '- Required checks: `npm run verify`'
            echo "- Result: **${VERIFY_OUTCOME}**"
            echo '- Audit policy: `npm audit --audit-level=high` is warning-only in `scripts/verify.ts`'
            echo '- Permissions: `{}`; no secrets, pushes, deployments, or timers'
          } >> "$GITHUB_STEP_SUMMARY"
